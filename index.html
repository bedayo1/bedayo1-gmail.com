<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 홈</title>
<link rel="stylesheet" href="./common/common.css">
<link rel="stylesheet" href="./index.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">기관사 안전교육 대시보드</h1>
  <p class="page-desc">발표용 데모 홈 화면입니다. 메뉴는 왼쪽 사이드바에서 확인할 수 있습니다.</p>

  <section class="dashboard-grid">
    <div class="card stat-card">
      <div class="stat-label">등록된 교육과정</div>
      <div class="stat-value" id="stat-course-count">0</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">공지사항</div>
      <div class="stat-value" id="stat-notice-count">0</div>
    </div>
  </section>

  <section class="card notice-card">
    <div class="toolbar">
      <h2 class="page-title" style="font-size:16px; margin:0;">공지사항</h2>
      <button class="btn small" id="btn-add-notice">+ 공지 추가</button>
    </div>
    <ul class="notice-list" id="notice-list"></ul>
  </section>
</main>

<div id="site-footer"></div>

<script src="./common/common.js"></script>
<script src="./index.js"></script>
</body>
</html>
