<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 홈</title>
<link rel="stylesheet" href="./common/common.css">
<link rel="stylesheet" href="./pages/다이아/dia.css">
<link rel="stylesheet" href="./pages/사고사례/accident.css">
<link rel="stylesheet" href="./index.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">기관사 안전교육 대시보드</h1>
  <p class="page-desc">발표용 데모 홈 화면입니다. 메뉴는 왼쪽 사이드바에서 확인할 수 있습니다.</p>

  <section class="card attendance-card" id="attendance-card"></section>
</main>

<div id="site-footer"></div>

<!-- 출근 절차 마법사 (출무시간 → 승무적합성검사 → 지시전달사항 → 일일안전교육) -->
<div class="modal-backdrop" id="attendance-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <div class="wizard-steps" id="wizard-steps"></div>
      <button type="button" class="wizard-close" id="btn-wizard-close">×</button>
    </div>
    <div class="wizard-body" id="wizard-body"></div>
    <div class="modal-actions wizard-actions">
      <button type="button" class="btn secondary" id="btn-wizard-prev">이전</button>
      <button type="button" class="btn" id="btn-wizard-next">다음</button>
    </div>
  </div>
</div>

<!-- 출근 상세보기 (완료된 출근 정보 읽기전용 확인) -->
<div class="modal-backdrop" id="attendance-detail-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;">오늘의 출근 상세정보</h2>
      <button type="button" class="wizard-close" id="btn-attendance-detail-close">×</button>
    </div>
    <div class="wizard-body" id="attendance-detail-body"></div>
    <div class="modal-actions wizard-actions">
      <button type="button" class="btn secondary" id="btn-attendance-detail-close2">닫기</button>
    </div>
  </div>
</div>

<script src="./common/data-notices.js"></script>
<script src="./common/data-employees.js"></script>
<script src="./common/data-malfunctions.js"></script>
<script src="./common/data-emergencies.js"></script>
<script src="./common/data-accidents.js"></script>
<script src="./common/common.js"></script>
<script src="./pages/다이아/data/dia-data-신답승무사업소.js"></script>
<script src="./index.js"></script>
</body>
</html>
