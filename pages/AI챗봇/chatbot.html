<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - AI챗봇</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./chatbot.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">AI챗봇</h1>
  <p class="page-desc">겪고 있는 상황이나 증상을 편하게 적어주세요. 등록된 매뉴얼·사고사례 중 비슷한 자료를 찾아드립니다.</p>

  <section class="card chat-card">
    <div id="chat-log" class="chat-log"></div>
    <form id="chat-form" class="chat-form">
      <input type="text" id="chat-input" placeholder="예: 출입문이 안 열려요 / 정지신호 위반했을 때 조치는?" autocomplete="off" autofocus>
      <button type="submit" class="btn">전송</button>
    </form>
  </section>
</main>

<div id="site-footer"></div>

<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./chatbot.js"></script>
</body>
</html>
