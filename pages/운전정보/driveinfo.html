<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 운전정보</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./driveinfo.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">운전정보</h1>
  <p class="page-desc">사업소별 운전정보를 자유게시판처럼 등록하고 공유합니다. 파일 첨부도 가능합니다.</p>

  <section class="card">
    <div class="depot-tabs" id="depot-tabs"></div>

    <div class="toolbar">
      <div></div>
      <button class="btn" id="btn-new">+ 글쓰기</button>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th>제목 <span style="font-weight:400; text-transform:none; letter-spacing:0;">(클릭 시 상세보기)</span></th>
          <th>작성자</th>
          <th>사업소</th>
          <th>작성일</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="driveinfo-tbody"></tbody>
    </table>
  </section>
</main>

<div id="site-footer"></div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 class="page-title" style="font-size:18px;" id="modal-title">글쓰기</h2>
    <form id="driveinfo-form">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label for="f-title">제목</label>
        <input type="text" id="f-title" required>
      </div>
      <div class="form-row">
        <label for="f-author">작성자</label>
        <input type="text" id="f-author" required>
      </div>
      <div class="form-row">
        <label for="f-depot">사업소</label>
        <select id="f-depot"></select>
      </div>
      <div class="form-row">
        <label for="f-content">내용</label>
        <textarea id="f-content" rows="6" required></textarea>
      </div>
      <div class="form-row">
        <label for="f-attachments">첨부파일 — 파일을 이 페이지 폴더(예: files/)에 직접 넣은 뒤, 한 줄에 하나씩 "경로 | 설명" 형식으로 입력하세요</label>
        <textarea id="f-attachments" rows="3" placeholder="files/example.pdf | 관련 자료"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-cancel">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 상세 화면 (목록에서 제목 클릭 시) -->
<div class="modal-backdrop" id="detail-backdrop">
  <div class="modal">
    <h2 class="page-title" style="font-size:18px;" id="detail-title">-</h2>
    <div id="detail-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn secondary" id="btn-detail-close">닫기</button>
    </div>
  </div>
</div>

<script src="../../common/common.js"></script>
<script src="./driveinfo.js"></script>
</body>
</html>
