<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../../common/assets/favicon.svg">
<meta name="description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="기관사 안전교육 - 교육영상">
<meta property="og:description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:image" content="../../common/assets/1호선 신형전동차.jpg">
<title>기관사 안전교육 - 교육영상</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./video.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">교육영상</h1>
  <p class="page-desc">안전교육·직무교육 관련 영상을 등록하고 함께 시청합니다.</p>

  <section class="card">
    <div class="toolbar">
      <div class="video-type-tabs" id="video-type-tabs"></div>
      <button class="btn" id="btn-new">+ 동영상 추가</button>
    </div>

    <div class="list-search" id="video-search"></div>

    <div class="video-grid" id="video-grid"></div>
    <div class="pagination-bar" id="video-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 상세보기(영상 재생) -->
<div class="modal-backdrop" id="detail-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;" id="detail-title">-</h2>
      <button type="button" class="wizard-close" id="btn-detail-close">×</button>
    </div>
    <div class="wizard-body">
      <div class="wizard-section">
        <div class="post-detail-meta" id="detail-meta"></div>
        <div class="views-likes-bar" id="views-likes-mount"></div>
        <div id="video-player-mount"></div>
        <div id="detail-desc" class="video-detail-desc"></div>
      </div>
    </div>
    <div class="modal-actions wizard-actions">
      <button type="button" class="btn secondary" id="btn-detail-close2">닫기</button>
    </div>
  </div>
</div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;" id="modal-title">동영상 추가</h2>
      <button type="button" class="wizard-close" id="btn-cancel">×</button>
    </div>
    <div class="wizard-body">
      <form id="video-form">
        <input type="hidden" id="f-id">
        <div class="form-row">
          <label for="f-title">제목</label>
          <input type="text" id="f-title" required>
        </div>
        <div class="form-row">
          <label for="f-category">구분</label>
          <select id="f-category"></select>
        </div>
        <div class="form-row">
          <label for="f-author">등록자</label>
          <input type="text" id="f-author" required>
        </div>
        <div class="form-row">
          <label>영상 등록 방식</label>
          <div class="video-source-tabs">
            <label><input type="radio" name="f-source-mode" value="link" checked> 링크 (유튜브 등)</label>
            <label><input type="radio" name="f-source-mode" value="file"> 파일 업로드 (용량이 작은 영상 권장)</label>
          </div>
        </div>
        <div class="form-row" id="row-source-link">
          <label for="f-url">영상 링크 URL</label>
          <input type="url" id="f-url" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        <div class="form-row" id="row-source-file" hidden>
          <label for="f-video-picker">영상 파일 선택</label>
          <input type="file" id="f-video-picker" accept="video/*">
          <p class="video-file-note">브라우저 저장공간(로컬스토리지) 한계로 인해 너무 큰 영상 파일은 저장되지 않을 수 있습니다 (수십 MB 이하 권장). 큰 영상은 "링크" 방식(유튜브 업로드 후 링크 등록)을 이용해주세요.</p>
          <div id="video-file-name"></div>
        </div>
        <div class="form-row">
          <label for="f-desc">설명 (선택)</label>
          <textarea id="f-desc" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="btn-cancel2">취소</button>
          <button type="submit" class="btn">저장</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="../../common/firebase-config.js"></script>
<script src="../../common/data-notices.js"></script>
<script src="../../common/data-employees.js"></script>
<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./video.js"></script>
</body>
</html>
