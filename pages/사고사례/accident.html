<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../../common/assets/favicon.svg">
<meta name="description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="기관사 안전교육 - 사고사례">
<meta property="og:description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:image" content="../../common/assets/og-image.svg">
<title>기관사 안전교육 - 사고사례</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./accident.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">사고사례</h1>
  <p class="page-desc">과거 사고사례(운전정보)를 등록하고 학습 자료로 공유합니다.</p>

  <section class="card">
    <div class="toolbar">
      <button class="btn secondary" id="btn-download-all">⬇ 전체 다운로드</button>
      <button class="btn" id="btn-new">+ 사고사례 추가</button>
    </div>

    <div class="list-search" id="accident-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th class="col-no">번호</th>
          <th>제목 <span style="font-weight:400; text-transform:none; letter-spacing:0;">(클릭 시 상세보기)</span></th>
          <th>호선</th>
          <th>발생일</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="accident-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="accident-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="edit-modal-box">
    <h2 class="page-title" style="font-size:18px;" id="modal-title">사고사례 추가</h2>
    <form id="accident-form">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label for="f-no">호(예: 2026-1)</label>
        <input type="text" id="f-no" placeholder="예: 2026-15">
      </div>
      <div class="form-row">
        <label for="f-title">제목</label>
        <input type="text" id="f-title" required>
      </div>
      <div class="form-row">
        <label for="f-line">호선</label>
        <input type="text" id="f-line" placeholder="예: 4호선" required>
      </div>
      <div class="form-row">
        <label for="f-date">발생일</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="form-row">
        <label for="f-location">장소</label>
        <input type="text" id="f-location" placeholder="예: 4호선 길음역 하선">
      </div>
      <div class="form-row">
        <label for="f-overview">장애(발생)개요</label>
        <textarea id="f-overview" rows="3" required></textarea>
      </div>
      <div class="form-row">
        <label for="f-cause">원인</label>
        <textarea id="f-cause" rows="3"></textarea>
      </div>
      <div class="form-row">
        <label for="f-countermeasures">재발방지 대책</label>
        <textarea id="f-countermeasures" rows="4"></textarea>
      </div>
      <div class="form-row">
        <label for="f-extra">참고 (관련 표·현황 등, 선택)</label>
        <textarea id="f-extra" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label for="photo-editor">관련사진 — 사진을 이 안으로 끌어다 놓고, 사진 밑에 바로 설명을 적으세요</label>
        <div class="photo-editor-toolbar">
          <button type="button" class="btn secondary small" id="btn-add-photo">+ 사진 추가</button>
          <input type="file" id="f-photo-picker" accept="image/*" multiple style="display:none">
        </div>
        <div id="photo-editor" class="photo-editor" contenteditable="true"></div>
      </div>
      <div class="form-row">
        <label for="f-videos">관련 동영상 — 영상 파일을 이 페이지 폴더(예: videos/)에 직접 넣은 뒤, 한 줄에 하나씩 "경로 | 설명" 형식으로 입력하세요</label>
        <textarea id="f-videos" rows="3" placeholder="videos/case1.mp4 | 상황 재현 영상"></textarea>
      </div>
      <div class="form-row">
        <label style="display:flex; align-items:center; gap:8px; font-weight:600;">
          <input type="checkbox" id="f-notice-active" style="width:auto;">
          출근 화면 "긴급 공지"로 노출
        </label>
      </div>
      <div class="form-row">
        <label for="f-notice-start">노출 시작일 (선택 — 비워두면 즉시부터)</label>
        <input type="date" id="f-notice-start">
      </div>
      <div class="form-row">
        <label for="f-notice-end">노출 종료일 (선택 — 비워두면 계속 노출)</label>
        <input type="date" id="f-notice-end">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-cancel">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 상세 화면 (목록에서 제목 클릭 시) -->
<div class="modal-backdrop" id="detail-backdrop">
  <div class="modal" id="detail-modal-box">
    <div id="detail-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn secondary" id="btn-detail-close">닫기</button>
    </div>
  </div>
</div>

<script src="../../common/data-notices.js"></script>
<script src="../../common/data-employees.js"></script>
<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./accident.js"></script>
</body>
</html>
