<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 고장처치 매뉴얼</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./malfunction.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">고장처치 매뉴얼</h1>
  <p class="page-desc">차종별 전동차 고장처치 절차를 등록하고 관리합니다.</p>

  <section class="card">
    <div class="vehicle-tabs" id="vehicle-tabs"></div>

    <div class="toolbar">
      <div></div>
      <button class="btn" id="btn-new">+ 매뉴얼 추가</button>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th class="col-no">번호</th>
          <th>제목 <span style="font-weight:400; text-transform:none; letter-spacing:0;">(클릭 시 상세보기)</span></th>
          <th>차종</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="malfunction-tbody"></tbody>
    </table>
  </section>
</main>

<div id="site-footer"></div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" style="max-width:560px;">
    <h2 class="page-title" style="font-size:18px;" id="modal-title">매뉴얼 추가</h2>
    <form id="malfunction-form">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label for="f-title">제목</label>
        <input type="text" id="f-title" required>
      </div>
      <div class="form-row">
        <label for="f-vehicletype">차종</label>
        <select id="f-vehicletype">
          <option value="VVVF">1호선 VVVF</option>
          <option value="저항차">1호선 저항차</option>
          <option value="ATO">2호선 ATO</option>
        </select>
      </div>
      <div class="form-row">
        <label for="f-symptom">[현상]</label>
        <textarea id="f-symptom" rows="3"></textarea>
      </div>
      <div class="form-row">
        <label for="f-cause">[원인]</label>
        <textarea id="f-cause" rows="3"></textarea>
      </div>
      <div class="form-row">
        <label for="f-procedure">[조치요령]</label>
        <textarea id="f-procedure" rows="5" required></textarea>
      </div>
      <div class="form-row">
        <label for="f-state">[상태]</label>
        <textarea id="f-state" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label for="f-reference">[참고]</label>
        <textarea id="f-reference" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label for="f-notes">[※ 주의사항]</label>
        <textarea id="f-notes" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label for="f-photonote">[관련사진] (사진 설명)</label>
        <textarea id="f-photonote" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label for="f-photofile">관련사진 업로드</label>
        <input type="file" id="f-photofile" accept="image/*">
        <div id="photo-preview-wrap"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-cancel">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 상세 화면 (목록에서 제목 클릭 시) -->
<div class="modal-backdrop" id="detail-backdrop">
  <div class="modal">
    <h2 class="page-title" style="font-size:18px;" id="detail-title">-</h2>
    <div id="detail-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn secondary" id="btn-detail-close">닫기</button>
    </div>
  </div>
</div>

<script src="../../common/common.js"></script>
<script src="./malfunction.js"></script>
</body>
</html>
