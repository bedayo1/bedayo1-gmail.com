<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 문제(적합성검사) 관리</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./admin-quiz.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">문제(적합성검사) 관리</h1>
  <p class="page-desc">승무적합성 검사에 사용되는 문제를 등록하고 관리합니다.</p>

  <section class="card">
    <div class="toolbar">
      <div></div>
      <button class="btn" id="btn-new">+ 문제 추가</button>
    </div>

    <div class="list-search" id="admin-quiz-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th>분류</th>
          <th>문제</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="admin-quiz-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="admin-quiz-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 class="page-title" style="font-size:18px;" id="modal-title">문제 추가</h2>
    <form id="admin-quiz-form">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label for="f-category">분류</label>
        <input type="text" id="f-category" placeholder="예: 운전취급 규정" required>
      </div>
      <div class="form-row">
        <label for="f-question">문제</label>
        <textarea id="f-question" rows="3" required></textarea>
      </div>
      <div class="form-row">
        <label for="f-answer">정답</label>
        <input type="text" id="f-answer" placeholder="정답 내용" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-cancel">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="../../common/common.js"></script>
<script src="./admin-quiz.js"></script>
</body>
</html>
