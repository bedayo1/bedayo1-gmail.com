<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../../common/assets/favicon.svg">
<meta name="description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="기관사 안전교육 - 공지·지시사항 관리">
<meta property="og:description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:image" content="../../common/assets/1호선 신형전동차.jpg">
<title>기관사 안전교육 - 공지·지시사항 관리</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./admin-notice.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">공지·지시사항 관리</h1>
  <p class="page-desc">전 직원에게 공지되는 공지사항과 승무지시사항을 등록합니다.</p>

  <section class="card">
    <h2 class="page-title" style="font-size:16px; margin-top:0;">📋 확인현황 한눈에 보기</h2>
    <p class="page-desc" style="margin-top:-6px;">지금 노출 중인 공지마다 누가 확인했고 안 했는지 바로 보여줍니다.</p>
    <div id="ack-overview"></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <div></div>
      <button class="btn" id="btn-new">+ 등록</button>
    </div>

    <div class="list-search" id="admin-notice-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th>제목</th>
          <th>구분</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="admin-notice-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="admin-notice-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;" id="modal-title">등록</h2>
      <button type="button" class="wizard-close" id="btn-cancel">×</button>
    </div>
    <div class="wizard-body">
      <form id="admin-notice-form">
        <input type="hidden" id="f-id">
        <div class="form-row">
          <label for="f-title">제목</label>
          <input type="text" id="f-title" required>
        </div>
        <div class="form-row">
          <label for="f-type">구분</label>
          <select id="f-type"></select>
        </div>
        <div class="form-row">
          <label for="f-content">내용 (직접 입력 — 아래 문서 사진을 첨부하는 경우 비워둬도 됩니다)</label>
          <textarea id="f-content" rows="4"></textarea>
        </div>
        <div class="form-row">
          <label for="editor">[문서/사진 첨부] — 공문·안내문 사진을 이 안으로 끌어다 놓거나 붙여넣으면 그 자리에 그대로 삽입되어 직원 화면에도 그대로 보여집니다. 여러 장(여러 페이지)도 순서대로 추가할 수 있어요.</label>
          <div class="photo-editor-toolbar">
            <button type="button" class="btn secondary small" id="btn-add-photo">+ 사진 추가</button>
            <input type="file" id="f-photo-picker" accept="image/*" multiple style="display:none">
          </div>
          <div id="editor" class="photo-editor" contenteditable="true"></div>
        </div>
        <div class="form-row">
          <label for="f-file-picker">[원본 파일 첨부] — hwp·hwpx·pdf 등 원본 문서를 그대로 첨부합니다. 직원이 상세보기에서 원본 그대로 다운로드할 수 있어요. (사진처럼 화면에 바로 보이지는 않고, 다운로드 버튼으로 제공됩니다)</label>
          <div class="photo-editor-toolbar">
            <button type="button" class="btn secondary small" id="btn-add-file">+ 파일 추가</button>
            <input type="file" id="f-file-picker" multiple style="display:none">
          </div>
          <div id="file-attach-list" class="file-attach-list"></div>
        </div>
        <div class="form-row">
          <label for="f-start-date">노출 시작일 (선택 — 비워두면 즉시부터, 지시사항이 홈 화면 출근 절차에 노출되는 기간)</label>
          <input type="date" id="f-start-date">
        </div>
        <div class="form-row">
          <label for="f-end-date">노출 종료일 (선택 — 비워두면 계속 노출)</label>
          <input type="date" id="f-end-date">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="btn-cancel2">취소</button>
          <button type="submit" class="btn">저장</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 확인현황 모달 -->
<div class="modal-backdrop" id="ack-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;" id="ack-title">확인현황</h2>
      <button type="button" class="wizard-close" id="btn-ack-close">×</button>
    </div>
    <div class="wizard-body" id="ack-body"></div>
    <div class="modal-actions wizard-actions">
      <button type="button" class="btn secondary" id="btn-ack-download">⬇ 서명부 다운로드</button>
      <button type="button" class="btn secondary" id="btn-ack-close2">닫기</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="../../common/firebase-config.js"></script>
<script src="../../common/data-notices.js"></script>
<script src="../../common/data-employees.js"></script>
<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./admin-notice.js"></script>
</body>
</html>
