<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 교육과정 관리</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./course.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">교육과정 관리</h1>
  <p class="page-desc">새 메뉴를 만들 때 이 페이지(html/css/js 3종 세트)를 복사해서 사용하세요.</p>

  <section class="card">
    <div class="toolbar">
      <div></div>
      <button class="btn" id="btn-new">+ 교육과정 추가</button>
    </div>

    <div class="list-search" id="course-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th>과정명</th>
          <th>대상</th>
          <th class="mobile-hide">교육시간</th>
          <th>상태</th>
          <th>이수</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="course-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="course-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 class="page-title" style="font-size:18px;" id="modal-title">교육과정 추가</h2>
    <form id="course-form">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label for="f-name">과정명</label>
        <input type="text" id="f-name" required>
      </div>
      <div class="form-row">
        <label for="f-target">대상</label>
        <input type="text" id="f-target" placeholder="예: 신입 기관사" required>
      </div>
      <div class="form-row">
        <label for="f-hours">교육시간(시간)</label>
        <input type="number" id="f-hours" min="1" required>
      </div>
      <div class="form-row">
        <label for="f-status">상태</label>
        <select id="f-status">
          <option value="planned">예정</option>
          <option value="ongoing">진행중</option>
          <option value="done">완료</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-cancel">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./course.js"></script>
</body>
</html>
