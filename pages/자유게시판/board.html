<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../../common/assets/favicon.svg">
<meta name="description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="기관사 안전교육 - 자유게시판">
<meta property="og:description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:image" content="../../common/assets/1호선 신형전동차.jpg">
<title>기관사 안전교육 - 자유게시판</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./board.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">자유게시판</h1>
  <p class="page-desc">직원들의 자유로운 소통 공간입니다.</p>

  <section class="card">
    <div class="toolbar">
      <button class="btn secondary" id="btn-download-all">⬇ 전체 다운로드</button>
      <button class="btn" id="btn-new">+ 글쓰기</button>
    </div>

    <div class="list-search" id="board-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th>제목</th>
          <th>작성자</th>
          <th>작성일</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="board-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="board-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 상세보기 (본문 + 댓글) -->
<div class="modal-backdrop" id="detail-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;" id="detail-title">-</h2>
      <button type="button" class="wizard-close" id="btn-detail-close">×</button>
    </div>
    <div class="wizard-body">
      <div class="wizard-section">
        <div class="post-detail-meta" id="detail-meta"></div>
        <div class="views-likes-bar" id="views-likes-mount"></div>
        <p class="post-detail-content" id="detail-content" style="white-space: pre-wrap;"></p>
      </div>
      <div class="wizard-section">
        <h4>댓글 <span id="comment-count"></span></h4>
        <div id="comment-list"></div>
        <form id="comment-form" class="comment-form">
          <input type="text" id="c-author" placeholder="이름" required>
          <input type="text" id="c-content" placeholder="댓글을 입력하세요" required>
          <button type="submit" class="btn small">등록</button>
        </form>
      </div>
    </div>
    <div class="modal-actions wizard-actions">
      <button type="button" class="btn secondary" id="btn-detail-close2">닫기</button>
    </div>
  </div>
</div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 class="page-title" style="font-size:18px;" id="modal-title">글쓰기</h2>
    <form id="board-form">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label for="f-title">제목</label>
        <input type="text" id="f-title" required>
      </div>
      <div class="form-row">
        <label for="f-author">작성자</label>
        <input type="text" id="f-author" required>
      </div>
      <div class="form-row">
        <label for="f-content">내용</label>
        <textarea id="f-content" rows="5" required></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-cancel">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="../../common/data-notices.js"></script>
<script src="../../common/data-employees.js"></script>
<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./board.js"></script>
</body>
</html>
