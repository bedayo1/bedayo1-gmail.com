<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../../common/assets/favicon.svg">
<meta name="description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="기관사 안전교육 - 다이아·스케줄 관리">
<meta property="og:description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:image" content="../../common/assets/og-image.svg">
<title>기관사 안전교육 - 다이아·스케줄 관리</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./admin-schedule.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">다이아·스케줄 관리</h1>
  <p class="page-desc">노선별 다이아(운행 스케줄)와 출무시간을 등록합니다.</p>

  <section class="card">
    <div class="toolbar">
      <div></div>
      <button class="btn" id="btn-new">+ 다이아 추가</button>
    </div>

    <div class="list-search" id="admin-schedule-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th>호선</th>
          <th>다이아번호</th>
          <th>출무시간</th>
          <th>역 수</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="admin-schedule-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="admin-schedule-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 등록/수정 모달 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 class="page-title" style="font-size:18px;" id="modal-title">다이아 추가</h2>
    <form id="admin-schedule-form">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <label for="f-line">호선</label>
        <input type="text" id="f-line" placeholder="예: 2호선" required>
      </div>
      <div class="form-row">
        <label for="f-diano">다이아번호</label>
        <input type="text" id="f-diano" placeholder="예: 108" required>
      </div>
      <div class="form-row">
        <label for="f-starttime">출무시간</label>
        <input type="time" id="f-starttime" required>
      </div>
      <div class="form-row">
        <label for="f-stations">역 수</label>
        <input type="number" id="f-stations" min="1" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-cancel">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="../../common/data-notices.js"></script>
<script src="../../common/data-employees.js"></script>
<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./admin-schedule.js"></script>
</body>
</html>
