<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 일일안전교육 모니터링</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./admin-education.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">일일안전교육 모니터링</h1>
  <p class="page-desc">출근 시 응시한 일일안전교육(고장처치·이례상황 매뉴얼 기반 문제풀이) 결과를 직원별로 확인합니다.</p>

  <section class="dashboard-grid">
    <div class="card stat-card">
      <div class="stat-label">전체 응시 건수</div>
      <div class="stat-value" id="stat-total-count">0</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">전체 평균 점수</div>
      <div class="stat-value" id="stat-avg-score">0점</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">전체 정답률</div>
      <div class="stat-value" id="stat-accuracy">0%</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">미응시 직원</div>
      <div class="stat-value" id="stat-no-attempt">0명</div>
    </div>
  </section>

  <section class="card">
    <div class="list-search" id="edu-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th class="mobile-hide">사번</th>
          <th>이름</th>
          <th>소속</th>
          <th>응시횟수</th>
          <th>평균점수</th>
          <th>정답률</th>
          <th>대표 취약분야</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="edu-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="edu-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 직원별 학습결과 상세 -->
<div class="modal-backdrop" id="edu-detail-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;" id="edu-detail-title">학습결과 상세</h2>
      <button type="button" class="wizard-close" id="btn-edu-detail-close">×</button>
    </div>
    <div class="wizard-body" id="edu-detail-body"></div>
    <div class="modal-actions wizard-actions">
      <button type="button" class="btn secondary" id="btn-edu-detail-close2">닫기</button>
    </div>
  </div>
</div>

<script src="../../common/common.js"></script>
<script src="./admin-education.js"></script>
</body>
</html>
