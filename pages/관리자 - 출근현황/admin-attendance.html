<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../../common/assets/favicon.svg">
<meta name="description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="기관사 안전교육 - 출근현황">
<meta property="og:description" content="고장처치·이례상황 매뉴얼, 사고사례, 교육과정, AI챗봇 등을 제공하는 기관사(승무원) 안전교육 웹앱입니다.">
<meta property="og:image" content="../../common/assets/og-image.svg">
<title>기관사 안전교육 - 출근현황</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./admin-attendance.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">출근현황</h1>
  <p class="page-desc">출무시간·승무적합성검사 결과를 날짜별로 확인합니다. 직무배제 대상은 자동으로 표시됩니다.</p>

  <section class="card">
    <div class="toolbar">
      <div class="form-row" style="margin:0;">
        <label for="att-date">조회 날짜</label>
        <input type="date" id="att-date">
      </div>
      <div></div>
    </div>
  </section>

  <section class="dashboard-grid">
    <div class="card stat-card">
      <div class="stat-label">전체 직원</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">출근 완료</div>
      <div class="stat-value" id="stat-done">0</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">직무배제</div>
      <div class="stat-value" id="stat-excluded">0</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">미출근</div>
      <div class="stat-value" id="stat-none">0</div>
    </div>
  </section>

  <section class="card">
    <div class="list-search" id="att-search"></div>

    <table class="data-table">
      <thead>
        <tr>
          <th class="mobile-hide">사번</th>
          <th>이름</th>
          <th>소속</th>
          <th>상태</th>
          <th>출무시간</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="att-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="att-pager"></div>
  </section>
</main>

<div id="site-footer"></div>

<!-- 출근 상세 -->
<div class="modal-backdrop" id="att-detail-backdrop">
  <div class="modal wizard-modal">
    <div class="wizard-header">
      <h2 class="page-title" style="font-size:16px; margin:0;" id="att-detail-title">출근 상세</h2>
      <button type="button" class="wizard-close" id="btn-att-detail-close">×</button>
    </div>
    <div class="wizard-body" id="att-detail-body"></div>
    <div class="modal-actions wizard-actions">
      <button type="button" class="btn secondary" id="btn-att-detail-close2">닫기</button>
    </div>
  </div>
</div>

<script src="../../common/data-notices.js"></script>
<script src="../../common/data-employees.js"></script>
<script src="../../common/data-malfunctions.js"></script>
<script src="../../common/data-emergencies.js"></script>
<script src="../../common/data-accidents.js"></script>
<script src="../../common/common.js"></script>
<script src="./admin-attendance.js"></script>
</body>
</html>
