<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기관사 안전교육 - 마이페이지</title>
<link rel="stylesheet" href="../../common/common.css">
<link rel="stylesheet" href="./mypage.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-sidebar"></div>

<main class="app-main">
  <h1 class="page-title">마이페이지</h1>
  <p class="page-desc">내 정보와 활동 현황을 확인합니다.</p>

  <section class="card profile-card">
    <div class="profile-avatar">👤</div>
    <div>
      <h2 id="profile-name" style="margin:0 0 4px;">-</h2>
      <p id="profile-meta" style="margin:0; color:var(--color-text-muted); font-size:13px;">-</p>
    </div>
  </section>

  <section class="mypage-stat-grid">
    <div class="card mypage-stat-box">
      <div class="mypage-stat-num" id="stat-accident">0</div>
      <div class="mypage-stat-label">사고사례</div>
    </div>
    <div class="card mypage-stat-box">
      <div class="mypage-stat-num" id="stat-malfunction">0</div>
      <div class="mypage-stat-label">고장처치 매뉴얼</div>
    </div>
    <div class="card mypage-stat-box">
      <div class="mypage-stat-num" id="stat-emergency">0</div>
      <div class="mypage-stat-label">이례상황 매뉴얼</div>
    </div>
    <div class="card mypage-stat-box">
      <div class="mypage-stat-num" id="stat-post">0</div>
      <div class="mypage-stat-label">내가 쓴 게시글</div>
    </div>
  </section>

  <section class="card">
    <h2 class="page-title" style="font-size:16px;">🔑 비밀번호 변경</h2>
    <form id="pw-form">
      <div class="form-row">
        <label for="pw-old">현재 비밀번호</label>
        <input type="password" id="pw-old" placeholder="현재 비밀번호" required>
      </div>
      <div class="form-row">
        <label for="pw-new1">새 비밀번호</label>
        <input type="password" id="pw-new1" placeholder="새 비밀번호 (4자리 이상)" required>
      </div>
      <div class="form-row">
        <label for="pw-new2">새 비밀번호 확인</label>
        <input type="password" id="pw-new2" placeholder="새 비밀번호 재입력" required>
      </div>
      <button type="submit" class="btn">변경하기</button>
    </form>
  </section>
</main>

<div id="site-footer"></div>

<script src="../../common/common.js"></script>
<script src="./mypage.js"></script>
</body>
</html>
